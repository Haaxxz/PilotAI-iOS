name: Build SwiftUI PilotAI iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            echo "Xcode 15.4 not found, using default: $(xcode-select -p)"
          fi
          xcodebuild -version
          swift --version

      - name: List Available Schemes
        run: xcodebuild -project PilotAI.xcodeproj -list

      - name: Run Swift unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PilotAI.xcodeproj \
            -scheme PilotAI \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing:PilotAITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0

      - name: Archive native SwiftUI app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PilotAI.xcodeproj \
            -scheme PilotAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PilotAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_VERSION=5.0

      - name: Verify Archive
        run: |
          echo "=== Archive contents ==="
          ls -lh build/PilotAI.xcarchive/Products/Applications/ || { echo "ERROR: Archive Products missing!"; exit 1; }
          echo ""
          echo "=== Binary info ==="
          BINARY="build/PilotAI.xcarchive/Products/Applications/PilotAI.app/PilotAI"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          file "$BINARY"
          echo "Binary size (bytes): $(wc -c < "$BINARY")"
          ls -lh "$BINARY"
          echo ""
          echo "=== Linked frameworks (confirms real Swift binary) ==="
          otool -L "$BINARY" | head -20
          echo ""
          echo "=== App bundle size ==="
          du -sh build/PilotAI.xcarchive/Products/Applications/PilotAI.app
          echo ""
          echo "=== All files in .app ==="
          find build/PilotAI.xcarchive/Products/Applications/PilotAI.app -type f | sort

      - name: Package unsigned IPA from native SwiftUI archive
        run: |
          rm -rf build/Payload build/PilotAI-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/PilotAI.xcarchive/Products/Applications/PilotAI.app build/Payload/
          cd build
          zip -X -r9 PilotAI-unsigned.ipa Payload
          echo "=== IPA size ==="
          du -sh PilotAI-unsigned.ipa
          echo "=== IPA contents ==="
          unzip -l PilotAI-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotAI-iOS-IPA
          path: build/PilotAI-unsigned.ipa
          retention-days: 14
